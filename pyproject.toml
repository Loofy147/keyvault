[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyvault"
version = "0.1.0"
description = "Local encrypted credential vault with an MCP server that lets agents use API secrets without seeing them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "httpx>=0.27", "mcp>=2,<3", "keyring>=25.7.0,<27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
keyvault = "keyvault.cli:main"

[tool.setuptools]
packages = ["keyvault"]

[tool.setuptools.package-data]
keyvault = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
